name: Build OnePlus 15R APK (arm64-v8a)

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-oneplus15r-apk:
    name: Build WirelessSignalMeter CDR Release (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK (Platform 37 & NDK 27.3.13750724)
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-37 build-tools;36.0.0 ndk;27.3.13750724'

      - name: Ensure Debug Keystore Exists for Release Signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build CDR Release APK (arm64-v8a with 16KB Page Alignment)
        run: ./gradlew :networksurvey:assembleCdrRelease --no-daemon --stacktrace

      - name: Verify APK Signature & Native 16KB Alignment
        run: |
          APK_PATH=$(find networksurvey/build/outputs/apk/cdr/release -name "*.apk" | head -n 1)
          echo "Built APK: $APK_PATH"
          ls -lh "$APK_PATH"
          cp "$APK_PATH" WirelessSignalMeter-v1.2.0-OnePlus15R-arm64-v8a.apk

      - name: Upload OnePlus 15R APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WirelessSignalMeter-OnePlus15R-arm64-v8a-APK
          path: WirelessSignalMeter-v1.2.0-OnePlus15R-arm64-v8a.apk
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-oneplus15r
          name: "无线无忧 WirelessSignalMeter v1.2.0 (OnePlus 15R / arm64-v8a)"
          body: |
            ### 适配机型与架构说明
            - **目标设备**：OnePlus 15R（Snapdragon 8 Gen 5 / OxygenOS 16 / Android 16）
            - **ABI 架构**：`arm64-v8a`（支持 Android 15/16 16KB 页面对齐 `-Wl,-z,max-page-size=16384`）
            - **构建变体**：`cdrRelease`（无广告/无追踪纯净版，包名 `com.wireless.signalmeter.new`）
            - **内置高通组件**：`libwireless_root_diag.so`（Qualcomm DIAG 信令/QMDL 采集）与 `libwireless_band_lock.so`（锁频段）
          files: WirelessSignalMeter-v1.2.0-OnePlus15R-arm64-v8a.apk
          draft: false
          prerelease: false
